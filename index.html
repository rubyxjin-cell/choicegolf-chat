<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>초이스골프 AI 예약</title>
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif; background: #0a0f0d; color: #e8f0ec; height: 100dvh; overflow: hidden; }

  #loginWrap { display: flex; align-items: center; justify-content: center; height: 100dvh; }
  #loginBox { text-align: center; padding: 40px; }
  #loginBox .icon { font-size: 52px; margin-bottom: 12px; }
  #loginBox h1 { font-size: 24px; font-weight: 800; color: #34d399; margin-bottom: 4px; letter-spacing: -0.5px; }
  #loginBox p { font-size: 13px; color: #7a9a8a; margin-bottom: 32px; }
  #loginBox input { width: 220px; padding: 14px 16px; border-radius: 12px; border: 1px solid #2a3a32; background: #131a16; color: #e8f0ec; font-size: 16px; text-align: center; outline: none; display: block; margin: 0 auto; }
  #loginBox input::placeholder { color: #7a9a8a; }
  #loginBox button { display: block; width: 220px; margin: 12px auto 0; padding: 14px; border-radius: 12px; border: none; background: #34d399; color: #0a0f0d; font-size: 15px; font-weight: 700; cursor: pointer; }

  #chatWrap { display: none; flex-direction: column; height: 100dvh; }
  #chatHeader { padding: 16px 20px; background: #131a16; border-bottom: 1px solid #2a3a32; flex-shrink: 0; display: flex; align-items: center; gap: 12px; }
  #chatHeader .icon { font-size: 26px; }
  #chatHeader .title { font-size: 16px; font-weight: 800; }
  #chatHeader .status { font-size: 11px; color: #34d399; }
  #resetBtn { margin-left: auto; padding: 6px 12px; border-radius: 8px; border: 1px solid #2a3a32; background: transparent; color: #7a9a8a; font-size: 12px; cursor: pointer; }
  #resetBtn:active { background: #2a3a32; }

  #messages { flex: 1; overflow-y: auto; padding: 16px 12px; -webkit-overflow-scrolling: touch; }
  .msg { display: flex; margin-bottom: 10px; }
  .msg.user { justify-content: flex-end; }
  .msg.ai { justify-content: flex-start; }
  .bubble { max-width: 85%; padding: 12px 16px; border-radius: 16px; font-size: 14px; line-height: 1.65; white-space: pre-wrap; word-break: break-word; }
  .msg.user .bubble { background: #1a6b4d; color: #e8f0ec; border-bottom-right-radius: 4px; }
  .msg.ai .bubble { background: #1a2420; color: #e8f0ec; border-bottom-left-radius: 4px; border: 1px solid #2a3a32; }

  .loading-dot { display: inline-block; animation: pulse 1.4s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

  .quick-btns { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .quick-btn { padding: 8px 14px; border-radius: 20px; border: 1px solid #2a3a32; background: #131a16; color: #34d399; font-size: 12px; font-weight: 600; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .quick-btn:active { background: #1a6b4d; }

  #inputArea { padding: 12px; background: #131a16; border-top: 1px solid #2a3a32; flex-shrink: 0; }
  #inputRow { display: flex; gap: 8px; max-width: 600px; margin: 0 auto; }
  #chatInput { flex: 1; padding: 14px 16px; border-radius: 12px; border: 1px solid #2a3a32; background: #1a2420; color: #e8f0ec; font-size: 15px; outline: none; font-family: inherit; }
  #chatInput::placeholder { color: #7a9a8a; }
  #sendBtn { padding: 14px 20px; border-radius: 12px; border: none; background: #34d399; color: #0a0f0d; font-size: 15px; font-weight: 700; cursor: pointer; flex-shrink: 0; -webkit-tap-highlight-color: transparent; }
  #sendBtn:disabled { background: #2a3a32; cursor: default; }
  #footer { text-align: center; font-size: 11px; color: #7a9a8a; margin-top: 8px; padding-bottom: env(safe-area-inset-bottom, 0); }
</style>
</head>
<body>

<div id="loginWrap">
  <div id="loginBox">
    <div class="icon">🏌️</div>
    <h1>초이스골프</h1>
    <p>AI 예약 관리 시스템</p>
    <input type="password" id="pwInput" placeholder="비밀번호 입력">
    <button onclick="doLogin()">로그인</button>
  </div>
</div>

<div id="chatWrap">
  <div id="chatHeader">
    <div class="icon">🏌️</div>
    <div>
      <div class="title">초이스골프 AI</div>
      <div class="status">● 온라인</div>
    </div>
    <button id="resetBtn" onclick="resetChat()">새 대화</button>
  </div>
  <div id="messages"></div>
  <div id="inputArea">
    <div id="inputRow">
      <input id="chatInput" placeholder="예약 정보를 입력하세요...">
      <button id="sendBtn" onclick="send()">전송</button>
    </div>
    <div id="footer">초이스골프 ☎ 1533-3160</div>
  </div>
</div>

<script>
const SB_URL = "https://qmzrpyyadoajwziqachm.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFtenJweXlhZG9hand6aXFhY2htIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQyMDI0NDcsImV4cCI6MjA4OTc3ODQ0N30.CI6ZFvNa2TRa0XqwnrXKL9x3ZHXfKg6GaNwJhqYvCmc";

const AGTS = [
  { id:"elite", name:"엘리트골프" },
  { id:"sangsang", name:"상상로드투어" },
  { id:"golf4ppl", name:"골프와사람들" },
  { id:"si", name:"시골프투어" },
];
const RM_LABEL = { IC:"인터컨티넨탈", HIR:"홀리데이인 호텔", HIS33:"콘도 33평형", NONE:"호텔없음(골프만)" };
const agtName = id => AGTS.find(a=>a.id===id)?.name || id;

// 대화 기록 (AI에게 맥락 전달용)
let aiHistory = [];
let partialData = null; // clarify 시 임시 저장

function resetChat() {
  aiHistory = [];
  partialData = null;
  pending = null;
  document.getElementById("messages").innerHTML = "";
  addAI("💬 새 대화를 시작합니다. 예약 정보를 말씀해주세요!");
}

async function sbApi(method, path, body) {
  const r = await fetch(SB_URL + "/rest/v1/" + path, {
    method,
    headers: {
      "apikey": SB_KEY,
      "Authorization": "Bearer " + SB_KEY,
      "Content-Type": "application/json",
      "Prefer": method==="POST"?"return=representation":method==="PATCH"?"return=representation":"",
    },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (!r.ok) {
    const errText = await r.text();
    console.error("Supabase error:", errText);
    throw new Error("DB 오류: " + r.status);
  }
  const t = await r.text();
  return t ? JSON.parse(t) : null;
}

async function callAI(userMsg) {
  // 대화 기록에 사용자 메시지 추가
  aiHistory.push({ role: "user", content: userMsg });

  // 최근 10개만 보내기 (비용 절약)
  const recentHistory = aiHistory.slice(-10);

  const r = await fetch("/api/chat", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ messages: recentHistory }),
  });
  const data = await r.json();
  if (!r.ok) {
    console.error("AI error:", data);
    throw new Error("AI 호출 실패: " + (data.error || r.status));
  }
  console.log("AI response:", data);

  // AI 응답도 기록에 추가 (맥락 유지)
  aiHistory.push({ role: "assistant", content: JSON.stringify(data) });

  return data;
}

async function doCreate(data) {
  const payload = {
    agt_id: data.agt_id || "elite",
    dep_date: data.dep_date,
    rep_name: data.rep_name,
    phone: data.phone || "",
    product_id: "alpensia",
    nights: data.nights || "1박2일",
    combo: data.combo || "prv|prv",
    teams: data.teams || 1,
    rm_type: data.rm_type || "HIS33",
    rm_cnt1: 1, rm_type2: "NONE", rm_cnt2: 0,
    rm_type3: "NONE", rm_cnt3: 0, rm_type4: "NONE", rm_cnt4: 0,
    rm_ppl1: 0, rm_ppl2: 0, rm_ppl3: 0, rm_ppl4: 0,
    tee1: "", tee2: "", tee3: "", tee4: "",
    tee_sur1: 0, tee_sur2: 0, tee_sur3: 0, tee_sur4: 0,
    tee_type1: data.tee_type1 ?? 1,
    tee_type2: data.tee_type2 ?? 0,
    tee_type3: data.tee_type3 ?? 0,
    tee_type4: data.tee_type4 ?? 0,
    gf_ppl: data.gf_ppl || 0,
    bf_ppl: data.bf_ppl || 0,
    bf_included: true,
    memo: data.memo || "",
    res_type: data.res_type || "confirmed",
  };
  console.log("Creating:", payload);
  return (await sbApi("POST", "reservations", payload))?.[0];
}

async function doSearch(query) {
  let path = "reservations?order=dep_date.desc&limit=30";
  if (query.rep_name) path += "&rep_name=eq." + encodeURIComponent(query.rep_name);
  if (query.dep_date) path += "&dep_date=eq." + query.dep_date;
  if (query.agt_id) path += "&agt_id=eq." + query.agt_id;
  if (query.month) {
    const [y, m] = query.month.split("-");
    const nm = parseInt(m) + 1;
    const end = nm > 12 ? (parseInt(y)+1)+"-01-01" : y+"-"+String(nm).padStart(2,"0")+"-01";
    path += "&dep_date=gte." + query.month + "-01&dep_date=lt." + end;
  }
  if (!query.rep_name && !query.dep_date && !query.agt_id && !query.month) {
    path = "reservations?order=dep_date.desc&limit=10";
  }
  return await sbApi("GET", path);
}

async function doDelete(id) { await sbApi("DELETE", "reservations?id=eq." + id); }
async function doUpdate(id, fields) { await sbApi("PATCH", "reservations?id=eq." + id, fields); }

function formatRes(r) {
  const combo = (r.combo||"").split("|").map(c=>c==="prv"?"회원":"대중").join("+");
  return "📌 " + r.rep_name + " | " + r.dep_date + " | " + r.nights +
    "\n   " + combo + " | " + (RM_LABEL[r.rm_type]||r.rm_type) + " | " + agtName(r.agt_id) +
    "\n   " + (r.res_type==="tentative"?"📋가예약":"✅확정") + " " + (r.phone||"") + (r.memo?" | "+r.memo:"");
}

// ============ UI ============
let pending = null;

function doLogin() {
  if (document.getElementById("pwInput").value === "0090") {
    document.getElementById("loginWrap").style.display = "none";
    document.getElementById("chatWrap").style.display = "flex";
    addAI("안녕하세요! 🏌️ 초이스골프 예약 AI입니다.\n\n자연스럽게 말씀하시면 알아서 처리해드립니다.\n정보가 부족하면 제가 다시 여쭤볼게요!\n\n📝 예시:\n• 엘리트 박병균 대대 콘도 예약잡아줘\n• 박병균 대2부 대1부로 변경해줘\n• 걍 삭제해 박병균꺼\n• 이번달 예약 보여줘");
    document.getElementById("chatInput").focus();
  } else { alert("비밀번호가 틀렸습니다."); }
}
document.getElementById("pwInput").addEventListener("keydown", e => { if(e.key==="Enter") doLogin(); });

function escHtml(s) { return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\n/g,"<br>"); }

function addBubble(role, text) {
  const wrap = document.getElementById("messages");
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.innerHTML = '<div class="bubble">' + escHtml(text) + '</div>';
  wrap.appendChild(div);
  wrap.scrollTop = wrap.scrollHeight;
}
function addAI(text) { addBubble("ai", text); }
function addUser(text) { addBubble("user", text); }

function addAIWithButtons(text, buttons) {
  const wrap = document.getElementById("messages");
  const div = document.createElement("div");
  div.className = "msg ai";
  let btnHtml = '<div class="quick-btns">';
  buttons.forEach(b => { btnHtml += '<button class="quick-btn" onclick="handleQuick(\'' + b + '\')">' + b + '</button>'; });
  btnHtml += '</div>';
  div.innerHTML = '<div class="bubble">' + escHtml(text) + btnHtml + '</div>';
  wrap.appendChild(div);
  wrap.scrollTop = wrap.scrollHeight;
}

function showLoading() {
  const wrap = document.getElementById("messages");
  const div = document.createElement("div");
  div.className = "msg ai"; div.id = "loadingMsg";
  div.innerHTML = '<div class="bubble"><span class="loading-dot">AI 분석 중...</span></div>';
  wrap.appendChild(div);
  wrap.scrollTop = wrap.scrollHeight;
}
function hideLoading() { const el = document.getElementById("loadingMsg"); if (el) el.remove(); }

function handleQuick(txt) {
  document.getElementById("chatInput").value = txt;
  send();
}

async function send() {
  const input = document.getElementById("chatInput");
  const msg = input.value.trim();
  if (!msg) return;
  input.value = "";
  addUser(msg);

  const btn = document.getElementById("sendBtn");
  btn.disabled = true;

  // Pending confirmation
  if (pending) {
    if (/^(확인|등록|네|ㅇㅇ|yes|삭제|변경|수정|ㅇ|ㅇㅋ|ㄱㄱ|고|좋아|오키|ok)$/i.test(msg)) {
      showLoading();
      try {
        if (pending.action === "create") {
          const result = await doCreate(pending.data);
          hideLoading();
          addAI("✅ 예약 등록 완료!\n\n" + formatRes(result));
          aiHistory = []; partialData = null; // 등록 완료 후 맥락 초기화
        } else if (pending.action === "delete") {
          await doDelete(pending.targetId);
          hideLoading();
          addAI("🗑️ 예약이 삭제되었습니다.");
          aiHistory = []; partialData = null;
        } else if (pending.action === "update") {
          await doUpdate(pending.targetId, pending.updates);
          hideLoading();
          addAI("✏️ 예약이 수정되었습니다.");
          aiHistory = []; partialData = null;
        }
      } catch(e) { hideLoading(); addAI("❌ 오류: " + e.message); }
      pending = null; btn.disabled = false; return;
    } else if (/^(취소|아니|ㄴㄴ|no|ㄴ)$/i.test(msg)) {
      pending = null; partialData = null; aiHistory = [];
      addAI("↩️ 취소되었습니다.");
      btn.disabled = false; return;
    }
    // Number selection
    const num = parseInt(msg);
    if (!isNaN(num) && pending.candidates) {
      const target = pending.candidates[num - 1];
      if (target) {
        if (pending.action === "delete_select") {
          pending = { action: "delete", targetId: target.id };
          addAIWithButtons("🗑️ 삭제할 예약:\n\n" + formatRes(target), ["삭제", "취소"]);
        } else if (pending.action === "update_select") {
          pending = { action: "update", targetId: target.id, updates: pending.updates };
          addAIWithButtons("✏️ 수정할 예약:\n\n" + formatRes(target), ["변경", "취소"]);
        }
        btn.disabled = false; return;
      }
    }
    // Not a confirm/cancel, treat as new input - fall through to AI
    pending = null;
  }

  // Call AI
  showLoading();
  try {
    const parsed = await callAI(msg);
    hideLoading();

    if (parsed.action === "create") {
      if (!parsed.data?.dep_date || !parsed.data?.rep_name) {
        addAI(parsed.confirm_message || parsed.message || "⚠️ 출발일과 대표자명을 포함해서 다시 말씀해주세요.");
      } else {
        // partial_data가 있으면 합치기
        if (partialData) {
          parsed.data = { ...partialData, ...parsed.data };
          partialData = null;
        }
        pending = { action: "create", data: parsed.data };
        addAIWithButtons(parsed.confirm_message || "등록하시겠습니까?", ["확인", "취소"]);
      }
    } else if (parsed.action === "clarify") {
      // 부분 데이터 저장
      if (parsed.partial_data) {
        partialData = { ...(partialData || {}), ...parsed.partial_data };
      }
      addAI(parsed.message || "추가 정보를 알려주세요.");
    } else if (parsed.action === "search") {
      try {
        const results = await doSearch(parsed.search_query || {});
        if (!results || results.length === 0) {
          addAI("🔍 검색 결과가 없습니다.");
        } else {
          const list = results.map((r,i) => (i+1) + ". " + formatRes(r)).join("\n\n");
          addAI("🔍 " + results.length + "건 조회됨\n\n" + list);
        }
      } catch(e) { addAI("❌ 조회 오류: " + e.message); }
    } else if (parsed.action === "delete") {
      try {
        const results = await doSearch(parsed.search_query || {});
        if (!results || results.length === 0) {
          addAI("🔍 해당 예약을 찾을 수 없습니다.");
        } else if (results.length === 1) {
          pending = { action: "delete", targetId: results[0].id };
          addAIWithButtons("🗑️ 삭제할 예약:\n\n" + formatRes(results[0]), ["삭제", "취소"]);
        } else {
          const list = results.map((r,i) => (i+1) + ". " + formatRes(r)).join("\n\n");
          addAI("🔍 " + results.length + "건 발견됨. 번호를 선택하세요:\n\n" + list);
          pending = { action: "delete_select", candidates: results };
        }
      } catch(e) { addAI("❌ 검색 오류: " + e.message); }
    } else if (parsed.action === "update") {
      try {
        const results = await doSearch(parsed.search_query || {});
        if (!results || results.length === 0) {
          addAI("🔍 해당 예약을 찾을 수 없습니다.");
        } else if (results.length === 1) {
          pending = { action: "update", targetId: results[0].id, updates: parsed.update_fields || {} };
          addAIWithButtons("✏️ 수정할 예약:\n\n" + formatRes(results[0]) + "\n\n" + (parsed.confirm_message||"변경하시겠습니까?"), ["변경", "취소"]);
        } else {
          const list = results.map((r,i) => (i+1) + ". " + formatRes(r)).join("\n\n");
          addAI("🔍 " + results.length + "건 발견됨. 번호를 선택하세요:\n\n" + list);
          pending = { action: "update_select", candidates: results, updates: parsed.update_fields || {} };
        }
      } catch(e) { addAI("❌ 검색 오류: " + e.message); }
    } else {
      addAI(parsed.error_message || parsed.message || parsed.confirm_message || "이해하지 못했습니다. 다시 말씀해주세요.");
    }
  } catch(e) {
    hideLoading();
    addAI("❌ 오류: " + e.message);
  }
  btn.disabled = false;
  document.getElementById("chatInput").focus();
}

document.getElementById("chatInput").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.isComposing) send();
});
</script>
</body>
</html>
