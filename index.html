<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>초이스골프 AI 예약</title>
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif; background: #0a0f0d; color: #e8f0ec; height: 100dvh; overflow: hidden; }
  
  /* Login */
  #loginWrap { display: flex; align-items: center; justify-content: center; height: 100dvh; }
  #loginBox { text-align: center; padding: 40px; }
  #loginBox .icon { font-size: 52px; margin-bottom: 12px; }
  #loginBox h1 { font-size: 24px; font-weight: 800; color: #34d399; margin-bottom: 4px; letter-spacing: -0.5px; }
  #loginBox p { font-size: 13px; color: #7a9a8a; margin-bottom: 32px; }
  #loginBox input { width: 220px; padding: 14px 16px; border-radius: 12px; border: 1px solid #2a3a32; background: #131a16; color: #e8f0ec; font-size: 16px; text-align: center; outline: none; display: block; margin: 0 auto; }
  #loginBox input::placeholder { color: #7a9a8a; }
  #loginBox button { display: block; width: 220px; margin: 12px auto 0; padding: 14px; border-radius: 12px; border: none; background: #34d399; color: #0a0f0d; font-size: 15px; font-weight: 700; cursor: pointer; }

  /* Chat layout */
  #chatWrap { display: none; flex-direction: column; height: 100dvh; }
  #chatHeader { padding: 16px 20px; background: #131a16; border-bottom: 1px solid #2a3a32; flex-shrink: 0; display: flex; align-items: center; gap: 12px; }
  #chatHeader .icon { font-size: 26px; }
  #chatHeader .title { font-size: 16px; font-weight: 800; }
  #chatHeader .status { font-size: 11px; color: #34d399; }
  
  #messages { flex: 1; overflow-y: auto; padding: 16px 12px; -webkit-overflow-scrolling: touch; }
  .msg { display: flex; margin-bottom: 10px; }
  .msg.user { justify-content: flex-end; }
  .msg.ai { justify-content: flex-start; }
  .bubble { max-width: 85%; padding: 12px 16px; border-radius: 16px; font-size: 14px; line-height: 1.65; white-space: pre-wrap; word-break: break-word; }
  .msg.user .bubble { background: #1a6b4d; color: #e8f0ec; border-bottom-right-radius: 4px; }
  .msg.ai .bubble { background: #1a2420; color: #e8f0ec; border-bottom-left-radius: 4px; border: 1px solid #2a3a32; }
  
  .loading-dot { display: inline-block; animation: pulse 1.4s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

  /* Quick buttons */
  .quick-btns { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .quick-btn { padding: 8px 14px; border-radius: 20px; border: 1px solid #2a3a32; background: #131a16; color: #34d399; font-size: 12px; font-weight: 600; cursor: pointer; }
  .quick-btn:active { background: #1a6b4d; }

  /* Input area */
  #inputArea { padding: 12px; background: #131a16; border-top: 1px solid #2a3a32; flex-shrink: 0; }
  #inputRow { display: flex; gap: 8px; max-width: 600px; margin: 0 auto; }
  #chatInput { flex: 1; padding: 14px 16px; border-radius: 12px; border: 1px solid #2a3a32; background: #1a2420; color: #e8f0ec; font-size: 15px; outline: none; font-family: inherit; }
  #chatInput::placeholder { color: #7a9a8a; }
  #sendBtn { padding: 14px 20px; border-radius: 12px; border: none; background: #34d399; color: #0a0f0d; font-size: 15px; font-weight: 700; cursor: pointer; flex-shrink: 0; }
  #sendBtn:disabled { background: #2a3a32; cursor: default; }
  #footer { text-align: center; font-size: 11px; color: #7a9a8a; margin-top: 8px; padding-bottom: env(safe-area-inset-bottom, 0); }
</style>

<script>
// ============ CONFIG ============
const SB_URL = "https://qmzrpyyadoajwziqachm.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFtenJweXlhZG9hand6aXFhY2htIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQyMDI0NDcsImV4cCI6MjA4OTc3ODQ0N30.CI6ZFvNa2TRa0XqwnrXKL9x3ZHXfKg6GaNwJhqYvCmc";

const AGTS = [
  { id:"elite", name:"엘리트골프", alias:["엘리트","엘리트골프"] },
  { id:"sangsang", name:"상상로드투어", alias:["상상","상상로드","상상로드투어"] },
  { id:"golf4ppl", name:"골프와사람들", alias:["골프와사람들","골사"] },
  { id:"si", name:"시골프투어", alias:["시골프","시골프투어"] },
];
const RM_MAP = {
  "콘도": "HIS33", "스위트": "HIS33", "콘도33": "HIS33",
  "인터컨": "IC", "인터컨티넨탈": "IC",
  "홀리데이인": "HIR", "홀리데이": "HIR",
  "골프만": "NONE", "숙소없음": "NONE", "호텔없음": "NONE",
};
const RM_LABEL = { IC:"인터컨티넨탈", HIR:"홀리데이인 호텔", HIS33:"콘도 33평형", NONE:"호텔없음(골프만)" };
const agtName = id => AGTS.find(a=>a.id===id)?.name || id;

// ============ SUPABASE ============
async function sb(method, path, body) {
  const r = await fetch(SB_URL + "/rest/v1/" + path, {
    method,
    headers: {
      "apikey": SB_KEY,
      "Authorization": "Bearer " + SB_KEY,
      "Content-Type": "application/json",
      "Prefer": method==="POST" ? "return=representation" : method==="PATCH" ? "return=representation" : "",
    },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (!r.ok) throw new Error(await r.text());
  const t = await r.text();
  return t ? JSON.parse(t) : null;
}

// ============ KOREAN PARSER ============
function parseInput(msg) {
  const txt = msg.trim();

  // --- Detect action ---
  if (/삭제|지워|취소해/.test(txt)) return parseDelete(txt);
  if (/변경|수정|바꿔|바꾸/.test(txt)) return parseUpdate(txt);
  if (/조회|보여|검색|목록|리스트|몇건/.test(txt)) return parseSearch(txt);
  // Default: create
  return parseCreate(txt);
}

function parseCreate(txt) {
  const d = {};

  // Date: 5/10, 5-10, 5월10일, 05.10
  const dm = txt.match(/(\d{1,2})\s*[\/\-\.월]\s*(\d{1,2})일?/);
  if (dm) {
    const mon = dm[1].padStart(2,"0"), day = dm[2].padStart(2,"0");
    d.dep_date = "2026-" + mon + "-" + day;
  }

  // Nights: 1박, 1박2일, 2박, 2박3일, 3박, 3박4일
  const nm = txt.match(/([123])박/);
  if (nm) {
    const n = parseInt(nm[1]);
    d.nights = n + "박" + (n+1) + "일";
  } else {
    d.nights = "1박2일";
  }
  const numRounds = parseInt(d.nights[0]) + 1;

  // Name: Korean name 2-4 chars (not matching known keywords)
  const keywords = "박일월화수목금토콘도스위트인터컨홀리데이골프만숙소없음호텔없음가예약확정예약확정엘리트상상시골프골프와사람들대중회원명팀부출발";
  const nameM = txt.match(/([가-힣]{2,4})\s*\d{2,3}[-\s]?\d{3,4}[-\s]?\d{4}/);
  if (nameM) {
    d.rep_name = nameM[1];
  } else {
    // Try standalone Korean name (2-3 chars not a keyword)
    const words = txt.split(/[\s,]+/);
    for (const w of words) {
      if (/^[가-힣]{2,4}$/.test(w) && !keywords.split("").some(k => w.includes(k)) && w.length >= 2 && w.length <= 4) {
        // More refined: skip if it's a known term
        const known = ["콘도","스위트","인터컨","홀리데이","골프만","가예약","확정","엘리트","상상","시골프","회원","대중","출발","확정예약","홀리데이인","인터컨티넨탈","골프와사람들","상상로드투어","시골프투어","엘리트골프","알펜시아"];
        if (!known.includes(w)) { d.rep_name = w; break; }
      }
    }
  }

  // Phone
  const pm = txt.match(/(\d{2,3})[-\s.]?(\d{3,4})[-\s.]?(\d{4})/);
  if (pm) d.phone = pm[1] + "-" + pm[2] + "-" + pm[3];

  // Course combo: 회1부, 회2부, 대1부, 대2부 patterns
  const rounds = [];
  // Match patterns like 회2부, 대1부, 회1 대2, etc
  const courseMatches = [...txt.matchAll(/(회|대)\s*(\d)\s*부?/g)];
  if (courseMatches.length > 0) {
    for (const cm of courseMatches) {
      rounds.push({ type: cm[1] === "회" ? "prv" : "pub", bu: parseInt(cm[2]) });
    }
  }
  // Fill remaining rounds with defaults
  while (rounds.length < numRounds) {
    rounds.push({ type: "prv", bu: rounds.length === 0 ? 2 : 1 });
  }
  d.combo = rounds.slice(0, numRounds).map(r => r.type).join("|");
  for (let i = 0; i < numRounds; i++) {
    d["tee_type" + (i+1)] = rounds[i]?.type === "prv" ? 1 : 0;
  }

  // Room type
  for (const [key, val] of Object.entries(RM_MAP)) {
    if (txt.includes(key)) { d.rm_type = val; break; }
  }
  if (!d.rm_type) d.rm_type = "HIS33";

  // AGT
  for (const a of AGTS) {
    for (const al of a.alias) {
      if (txt.includes(al)) { d.agt_id = a.id; break; }
    }
    if (d.agt_id) break;
  }
  if (!d.agt_id) d.agt_id = "elite";

  // Res type
  d.res_type = /가예약/.test(txt) ? "tentative" : "confirmed";

  // Teams
  const tm = txt.match(/(\d+)\s*팀/);
  d.teams = tm ? parseInt(tm[1]) : 1;

  // People
  const pplM = txt.match(/(\d+)\s*명/);
  d.gf_ppl = pplM ? parseInt(pplM[1]) : 0;

  // Memo: everything else we can't parse
  d.memo = "";

  // Validate
  if (!d.dep_date) return { action: "error", message: "⚠️ 출발일을 인식하지 못했습니다.\n예시: 5/10, 5월10일" };
  if (!d.rep_name) return { action: "error", message: "⚠️ 대표자명을 인식하지 못했습니다.\n이름을 포함해서 다시 입력해주세요." };

  // Build confirm message
  const roundLabels = rounds.slice(0, numRounds).map((r, i) =>
    `${i+1}R: ${r.type==="prv"?"회원제":"대중제"} ${r.bu}부`
  ).join("\n");

  const confirmMsg = `📋 예약 등록 확인

출발일: ${d.dep_date}
일정: ${d.nights}
대표자: ${d.rep_name}
연락처: ${d.phone || "미입력"}
${roundLabels}
숙소: ${RM_LABEL[d.rm_type]}
AGT: ${agtName(d.agt_id)}
유형: ${d.res_type === "tentative" ? "가예약" : "확정예약"}
${d.teams > 1 ? "팀수: " + d.teams + "팀\n" : ""}${d.gf_ppl > 0 ? "인원: " + d.gf_ppl + "명\n" : ""}
등록하시겠습니까?`;

  return { action: "create", data: d, message: confirmMsg };
}

function parseDelete(txt) {
  const q = {};
  const nameM = txt.match(/([가-힣]{2,4})\s*(님|의|예약|삭제|지워|취소)/);
  if (nameM) q.rep_name = nameM[1];
  const dm = txt.match(/(\d{1,2})\s*[\/\-\.월]\s*(\d{1,2})일?/);
  if (dm) q.dep_date = "2026-" + dm[1].padStart(2,"0") + "-" + dm[2].padStart(2,"0");
  if (!q.rep_name && !q.dep_date) return { action: "error", message: "⚠️ 삭제할 예약의 대표자명 또는 날짜를 알려주세요.\n예시: \"홍길동 예약 삭제해줘\"" };
  return { action: "delete", query: q };
}

function parseUpdate(txt) {
  const q = {};
  const nameM = txt.match(/([가-힣]{2,4})\s*(님|의|예약|날짜|변경|수정)/);
  if (nameM) q.rep_name = nameM[1];
  const dm = txt.match(/(\d{1,2})\s*[\/\-\.월]\s*(\d{1,2})일?\s*(예약|날짜|변경|수정)/);
  if (dm) q.dep_date = "2026-" + dm[1].padStart(2,"0") + "-" + dm[2].padStart(2,"0");

  // What to update
  const updates = {};
  const newDateM = txt.match(/(으로|로)\s*변경|(\d{1,2})\s*[\/\-\.월]\s*(\d{1,2})일?\s*(으로|로)/);
  const dateChangeM = txt.match(/(\d{1,2})\s*[\/\-\.월]\s*(\d{1,2})일?\s*(으로|로)/);
  if (dateChangeM) updates.dep_date = "2026-" + dateChangeM[1].padStart(2,"0") + "-" + dateChangeM[2].padStart(2,"0");

  if (/가예약/.test(txt)) updates.res_type = "tentative";
  if (/확정예약|확정으로/.test(txt)) updates.res_type = "confirmed";

  if (!q.rep_name) return { action: "error", message: "⚠️ 수정할 예약의 대표자명을 알려주세요.\n예시: \"홍길동 5/10 예약 날짜 5/15로 변경\"" };
  return { action: "update", query: q, updates };
}

function parseSearch(txt) {
  const q = {};
  // Check for month
  const monM = txt.match(/(이번|다음|(\d{1,2}))월/);
  if (monM) {
    const now = new Date();
    let mon;
    if (monM[1] === "이번") mon = now.getMonth() + 1;
    else if (monM[1] === "다음") mon = now.getMonth() + 2;
    else mon = parseInt(monM[2]);
    q.month = "2026-" + String(mon).padStart(2, "0");
  }
  // Check for name
  const nameM = txt.match(/([가-힣]{2,4})\s*(님|의|예약|조회|보여|검색)/);
  if (nameM) q.rep_name = nameM[1];
  // Check for AGT
  for (const a of AGTS) {
    for (const al of a.alias) {
      if (txt.includes(al)) { q.agt_id = a.id; break; }
    }
    if (q.agt_id) break;
  }
  // Check for date
  const dm = txt.match(/(\d{1,2})\s*[\/\-\.월]\s*(\d{1,2})일?/);
  if (dm) q.dep_date = "2026-" + dm[1].padStart(2,"0") + "-" + dm[2].padStart(2,"0");

  if (Object.keys(q).length === 0) {
    // Default: show all recent
    q.recent = true;
  }
  return { action: "search", query: q };
}

// ============ SUPABASE OPERATIONS ============
async function doCreate(data) {
  const numRounds = parseInt(data.nights[0]) + 1;
  const payload = {
    agt_id: data.agt_id || "elite",
    dep_date: data.dep_date,
    rep_name: data.rep_name,
    phone: data.phone || "",
    product_id: "alpensia",
    nights: data.nights || "1박2일",
    combo: data.combo || "prv|prv",
    teams: data.teams || 1,
    rm_type: data.rm_type || "HIS33",
    rm_cnt1: 1, rm_type2: "NONE", rm_cnt2: 0,
    rm_type3: "NONE", rm_cnt3: 0, rm_type4: "NONE", rm_cnt4: 0,
    rm_ppl1: 0, rm_ppl2: 0, rm_ppl3: 0, rm_ppl4: 0,
    tee1: "", tee2: "", tee3: "", tee4: "",
    tee_sur1: 0, tee_sur2: 0, tee_sur3: 0, tee_sur4: 0,
    tee_type1: data.tee_type1 ?? 1,
    tee_type2: data.tee_type2 ?? 0,
    tee_type3: data.tee_type3 ?? 0,
    tee_type4: data.tee_type4 ?? 0,
    gf_ppl: data.gf_ppl || 0,
    bf_ppl: data.bf_ppl || 0,
    bf_included: true,
    memo: data.memo || "",
    res_type: data.res_type || "confirmed",
  };
  const result = await sb("POST", "reservations", payload);
  return result?.[0];
}

async function doSearch(query) {
  let path = "reservations?order=dep_date.desc&limit=30";
  if (query.rep_name) path += "&rep_name=eq." + encodeURIComponent(query.rep_name);
  if (query.dep_date) path += "&dep_date=eq." + query.dep_date;
  if (query.agt_id) path += "&agt_id=eq." + query.agt_id;
  if (query.month) {
    const [y, m] = query.month.split("-");
    const start = query.month + "-01";
    const nextM = parseInt(m) + 1;
    const end = nextM > 12 ? (parseInt(y)+1) + "-01-01" : y + "-" + String(nextM).padStart(2,"0") + "-01";
    path += "&dep_date=gte." + start + "&dep_date=lt." + end;
  }
  if (query.recent) path = "reservations?order=dep_date.desc&limit=10";
  return await sb("GET", path);
}

async function doDelete(id) {
  await sb("DELETE", "reservations?id=eq." + id);
}

async function doUpdate(id, fields) {
  await sb("PATCH", "reservations?id=eq." + id, fields);
}

function formatRes(r) {
  const combo = (r.combo||"").split("|").map(c => c==="prv"?"회원":"대중").join("+");
  return `📌 ${r.rep_name} | ${r.dep_date} | ${r.nights}
   ${combo} | ${RM_LABEL[r.rm_type]||r.rm_type} | ${agtName(r.agt_id)}
   ${r.res_type==="tentative"?"📋가예약":"✅확정"} ${r.phone||""} ${r.memo?"| "+r.memo:""}`;
}

  div.innerHTML = `<div class="bubble">${escHtml(text)}</div>`;
  wrap.appendChild(div);
  wrap.scrollTop = wrap.scrollHeight;
}

function addAIWithButtons(text, buttons) {
  const wrap = document.getElementById("messages");
  const div = document.createElement("div");
  div.className = "msg ai";
  let btnHtml = `<div class="quick-btns">`;
  buttons.forEach(b => {
    btnHtml += `<button class="quick-btn" onclick="handleQuick('${escAttr(b)}')">${escHtml(b)}</button>`;
  });
  btnHtml += `</div>`;
  div.innerHTML = `<div class="bubble">${escHtml(text)}${btnHtml}</div>`;
  wrap.appendChild(div);
  wrap.scrollTop = wrap.scrollHeight;
}

function showLoading() {
  const wrap = document.getElementById("messages");
  const div = document.createElement("div");
  div.className = "msg ai";
  div.id = "loadingMsg";
  div.innerHTML = `<div class="bubble"><span class="loading-dot">분석 중...</span></div>`;
  wrap.appendChild(div);
  wrap.scrollTop = wrap.scrollHeight;
}
function hideLoading() {
  const el = document.getElementById("loadingMsg");
  if (el) el.remove();
}

function escHtml(s) { return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\n/g,"<br>"); }
function escAttr(s) { return s.replace(/'/g,"\\'").replace(/"/g,"&quot;"); }

function handleQuick(txt) {
  document.getElementById("chatInput").value = txt;
  send();
}

async function send() {
  const input = document.getElementById("chatInput");
  const msg = input.value.trim();
  if (!msg) return;
  input.value = "";
  addUser(msg);

  const btn = document.getElementById("sendBtn");
  btn.disabled = true;

  // Handle pending confirmation
  if (pending) {
    if (/^(확인|등록|네|ㅇㅇ|yes|삭제|변경|수정)$/i.test(msg)) {
      showLoading();
      try {
        if (pending.action === "create") {
          const result = await doCreate(pending.data);
          hideLoading();
          addAI(`✅ 예약 등록 완료!\n\n${formatRes(result)}`);
        } else if (pending.action === "delete") {
          await doDelete(pending.targetId);
          hideLoading();
          addAI("🗑️ 예약이 삭제되었습니다.");
        } else if (pending.action === "update") {
          await doUpdate(pending.targetId, pending.updates);
          hideLoading();
          addAI("✏️ 예약이 수정되었습니다.");
        }
      } catch(e) {
        hideLoading();
        addAI("❌ 오류: " + e.message);
      }
      pending = null;
      btn.disabled = false;
      return;
    } else if (/^(취소|아니|ㄴㄴ|no)$/i.test(msg)) {
      pending = null;
      addAI("↩️ 취소되었습니다.");
      btn.disabled = false;
      return;
    }
    // Number selection for multi-result
    const num = parseInt(msg);
    if (!isNaN(num) && pending.candidates) {
      const target = pending.candidates[num - 1];
      if (target) {
        if (pending.action === "delete_select") {
          pending = { action: "delete", targetId: target.id };
          addAIWithButtons(`🗑️ 삭제할 예약:\n\n${formatRes(target)}`, ["삭제", "취소"]);
        } else if (pending.action === "update_select") {
          pending = { action: "update", targetId: target.id, updates: pending.updates };
          addAIWithButtons(`✏️ 수정할 예약:\n\n${formatRes(target)}`, ["변경", "취소"]);
        }
        btn.disabled = false;
        return;
      }
    }
    pending = null;
  }

  // Parse input
  showLoading();
  // Small delay to show loading
  await new Promise(r => setTimeout(r, 300));

  try {
    const parsed = parseInput(msg);
    hideLoading();

    if (parsed.action === "error") {
      addAI(parsed.message);
    } else if (parsed.action === "create") {
      pending = { action: "create", data: parsed.data };
      addAIWithButtons(parsed.message, ["확인", "취소"]);
    } else if (parsed.action === "search") {
      const results = await doSearch(parsed.query);
      if (!results || results.length === 0) {
        addAI("🔍 검색 결과가 없습니다.");
      } else {
        const list = results.map((r,i) => `${i+1}. ${formatRes(r)}`).join("\n\n");
        addAI(`🔍 ${results.length}건 조회됨\n\n${list}`);
      }
    } else if (parsed.action === "delete") {
      const results = await doSearch(parsed.query);
      if (!results || results.length === 0) {
        addAI("🔍 해당 예약을 찾을 수 없습니다.");
      } else if (results.length === 1) {
        pending = { action: "delete", targetId: results[0].id };
        addAIWithButtons(`🗑️ 삭제할 예약:\n\n${formatRes(results[0])}`, ["삭제", "취소"]);
      } else {
        const list = results.map((r,i) => `${i+1}. ${formatRes(r)}`).join("\n\n");
        addAI(`🔍 ${results.length}건 발견됨. 번호를 선택하세요:\n\n${list}`);
        pending = { action: "delete_select", candidates: results };
      }
    } else if (parsed.action === "update") {
      const results = await doSearch(parsed.query);
      if (!results || results.length === 0) {
        addAI("🔍 해당 예약을 찾을 수 없습니다.");
      } else if (results.length === 1) {
        pending = { action: "update", targetId: results[0].id, updates: parsed.updates };
        addAIWithButtons(`✏️ 수정할 예약:\n\n${formatRes(results[0])}\n\n변경 내용: ${JSON.stringify(parsed.updates)}`, ["변경", "취소"]);
      } else {
        const list = results.map((r,i) => `${i+1}. ${formatRes(r)}`).join("\n\n");
        addAI(`🔍 ${results.length}건 발견됨. 번호를 선택하세요:\n\n${list}`);
        pending = { action: "update_select", candidates: results, updates: parsed.updates };
      }
    }
  } catch(e) {
    hideLoading();
    addAI("❌ 오류: " + e.message);
  }

  btn.disabled = false;
  document.getElementById("chatInput").focus();
}

document.getElementById("chatInput").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.isComposing) send();
});
</script>
</body>
</html>
